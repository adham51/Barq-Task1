- name: Create project directory
  ansible.builtin.file:
    path: /opt/postgres
    state: directory
    mode: "0755"

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: "0750"

- name: Template compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/postgres/docker-compose.yml
    mode: "0600"

# owned by uid 70 (postgres user in the alpine image) so the container can read it, but other host users can't
- name: Template app user init script
  ansible.builtin.template:
    src: init-user.sql.j2
    dest: /opt/postgres/init-user.sql
    owner: "70"
    group: "70"
    mode: "0600"

- name: Start PostgreSQL
  community.docker.docker_compose_v2:
    project_src: /opt/postgres
    state: present
    wait: true

- name: Install backup script
  ansible.builtin.template:
    src: pg_backup.sh.j2
    dest: /usr/local/bin/pg_backup.sh
    mode: "0750"

- name: Install restore script
  ansible.builtin.template:
    src: pg_restore.sh.j2
    dest: /usr/local/bin/pg_restore.sh
    mode: "0750"

- name: Schedule daily backup at 02:00
  ansible.builtin.cron:
    name: daily postgres backup
    minute: "0"
    hour: "2"
    job: "/usr/local/bin/pg_backup.sh >> /var/log/pg_backup.log 2>&1"
